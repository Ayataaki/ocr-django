<!-- ── CLIENTS ── -->
<div class="panel {% if active_panel == 'clients' %}active{% endif %}" id="panel-clients">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    
    <div style="font-size:13px;color:var(--text2)">
        {{ clients|length }} client enregistré 
    </div>

        <button class="btn btn-primary" onclick="openModal('add-client')">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          Nouveau client
        </button>
      </div>
      <div class="card">
        <div class="card-body">
          <table>
            <thead>
              <tr>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Email</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              {% for client in clients %}
              <tr>
                <td>{{ client.nom }}</td>
                <td>{{ client.prenom }}</td>
                <td>{{ client.email }}</td>
                <td>
                  <div class="actions">
                    <button class="btn btn-ghost btn-icon btn-sm">👁</button>
                    <button class="btn btn-ghost btn-icon btn-sm">✎</button>
                    <!-- Pas de suppression si on ne vérifie pas que ce client n'a pas de dossier !! -->
                    <button class="btn btn-danger btn-icon btn-sm">✕</button>
                  </div>
                </td>
                <!-- <th>Actions</th> -->
              </tr>
              {% endfor %}
