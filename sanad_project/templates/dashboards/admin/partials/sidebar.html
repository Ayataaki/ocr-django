<aside class="side">
  <div class="side-logo">
    <div class="brand">SANAD</div>
    <div class="sub">Espace administrateur</div>
  </div>
  <nav class="side-nav">
    <div class="nav-label">Principal</div>

    <button class="nav-link {% if active_panel == 'dashboard' %}active{% endif %}" onclick="show('dashboard', this)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
      Tableau de bord
    </button>

    <a class="nav-link {% if active_panel == 'utilisateurs' %}active{% endif %}" onclick="show('utilisateurs', this)">
       <!-- href="{% url 'utilisateur_list' %}"> -->
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      Utilisateurs
    </a>

    <button class="nav-link {% if active_panel == 'documents' %}active{% endif %}"            onclick="show('documents', this)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg>
      Documents
    </button>

    <a class="nav-link {% if active_panel == 'clients' %}active{% endif %}" onclick="show('clients', this)">
       <!-- href="{% url 'client_list' %}"> -->
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      Clients
    </a>

    <div class="nav-label" style="margin-top:8px">Système</div>

    <button class="nav-link {% if active_panel == 'journal' %}active{% endif %}"
            onclick="show('journal', this)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 3a9 9 0 00-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0013 21a9 9 0 000-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
      Journal d'accès
    </button>

    <button class="nav-link {% if active_panel == 'parametres' %}active{% endif %}"
            onclick="show('parametres', this)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      Paramètres
    </button>
  </nav>

  <div class="side-user">
    <div class="avatar">
      {{ request.user.prenom|first|upper }}{{ request.user.nom|first|upper }}
    </div>
    <div class="avatar-info">
      <div class="role">{{ request.user.role.nom|default:"Administrateur" }}</div>
    </div>
  </div>
</aside>
