<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<!-- Topbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">SANAD Admin</a>
    <div class="d-flex">
      <a href="#" class="btn btn-outline-light me-2">Profil</a>
      <a href="#" class="btn btn-danger">Déconnexion</a>
      <!-- <a href="{% url 'logout' %}" class="btn btn-danger">Déconnexion</a> -->
    </div>
  </div>
</nav>

<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <nav class="col-md-2 d-none d-md-block bg-light sidebar vh-100">
      <div class="position-sticky pt-3">
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link active" href="#" onclick="loadPage('utilisateurs')">Utilisateurs</a></li>
          <li class="nav-item"><a class="nav-link" href="#" onclick="loadPage('documents')">Documents</a></li>
          <li class="nav-item"><a class="nav-link" href="#" onclick="loadPage('parametres')">Paramètres</a></li>
        </ul>
      </div>
    </nav>

    <!-- Contenu principal -->
    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4" id="main-content">
      <h2>Bienvenue sur le Dashboard</h2>
      <p>Sélectionnez une section dans le menu.</p>
    </main>
  </div>
</div>

<script>
function loadPage(page) {
    // Exemple simple : remplacer le contenu
    document.getElementById("main-content").innerHTML = "<h2>" + page + "</h2><p>Contenu chargé dynamiquement...</p>";
}
</script>

</body>
</html>
