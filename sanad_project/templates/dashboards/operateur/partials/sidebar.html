<aside class="side">
  <div class="side-logo">
    <div class="brand">SANAD</div>
    <div class="sub">Espace opérateur</div>
  </div>
  <nav class="side-nav">
    <div class="nav-label">Principal</div>

    <button class="nav-link {% if active_panel == 'dashboard' %}active{% endif %}" onclick="show('dashboard', this)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
      Tableau de bord
    </button>

    <!-- Pas de gestion d'utilisateurs pour les opérateurs !!!!!! -->

    <!-- <a class="nav-link {% if active_panel == 'utilisateurs' %}active{% endif %}" onclick="show('utilisateurs', this)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      Utilisateurs
    </a> -->

    <button class="nav-link {% if active_panel == 'nouveau' %}active{% endif %}"            onclick="show('nouveau', this)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg>
      Nouveau dossier
    </button>

    <!-- A enlever ce document !!!!!!! -->
    <button class="nav-link {% if active_panel == 'nvDoc' %}active{% endif %}"            onclick="show('nvDoc', this)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/></svg>
      Nouveau document
    </button>

    <button class="nav-link {% if active_panel == 'recherche' %}active{% endif %}"            onclick="show('recherche', this)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      Recherche
    </button>

    <button class="nav-link {% if active_panel == 'scan' %}active{% endif %}"            onclick="show('scan', this)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
      Scanner et OCR
    </button>

    <a class="nav-link {% if active_panel == 'clients' %}active{% endif %}" onclick="show('clients', this)">
       <!-- href="{% url 'client_list' %}"> -->
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      Clients
    </a>

    <div class="nav-label" style="margin-top:8px">Gestion</div>

    <button class="nav-link {% if active_panel == 'clients' %}active{% endif %}"
            onclick="show('clients', this)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      Clients
    </button>

    <button class="nav-link {% if active_panel == 'documents' %}active{% endif %}"
            onclick="show('documents', this)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/></svg>
      Documents
    </button>
  </nav>

  <div class="side-user">
    <div class="avatar">
      {{ request.user.prenom|first|upper }}{{ request.user.nom|first|upper }}
    </div>
    <div class="avatar-info">
      <div class="role">{{ request.user.role.nom|default:"Opérateur" }}</div>
    </div>
  </div>
</aside>
