  <div class="modal" id="modal-add-dossier" style="display:none">
    
    <div class="modal-head">
      <h3>Nouveau dossier</h3>
      <button class="btn btn-ghost btn-icon" onclick="closeModal()">✕</button>
    </div>
    
    <form method="POST" action="{% url 'ajout_dossier_operateur' %}">
    {% csrf_token %}

    <div class="modal-body">
      <div class="form-grid">

        <div class="field full">
          <label>Intitulé du dossier</label>
          <input name="reference_dossier" placeholder="Ex: Vente appartement Maarif"/>
        </div>

        <!-- un meme client peut avoir le meme nom et prenom et donc il faut identifier !!  -->
        <div class="field full">
          <label>Client</label>
          <select id="client-select" style="flex:1" onchange="ClientDetail.load(this.value)">
          <option value="">-- Choisir --</option>
          {% for client in clients %}
          <option value="{{ client.id }}">
            {% if client.personne_physique %}
            {{ client.personne_physique.nom }} {{ client.personne_physique.prenom }}
            — {{ client.personne_physique.numero_identite }}
            {% elif client.personne_morale %}
            {{ client.personne_morale.raison_sociale }}
            — {{ client.personne_morale.ice|default:client.personne_morale.numero_rc }}
            {% endif %}
          </option>
          {% endfor %}
          </select>
        </div>

        <div class="field full">
          <label>Description du dossier</label>
          <input name="description" placeholder="Description du dossier"/>
        </div>
        
        <div class="field">
          <label>Statut</label>
          <select name="statut">
            <option value="actif">Actif</option>
            <option value="inactif">Inactif</option>
            <option value="cloture">Clôturé</option>
            <option value="archive">Archivé</option>
          </select>
        </div> 

      </div>
    
    </div>
    
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary">Créer le dossier</button>
    </div>

    </form>
  </div>
