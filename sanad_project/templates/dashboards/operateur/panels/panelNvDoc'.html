<div class="panel {% if active_panel == 'nvDoc' %}active{% endif %}" id="panel-nvDoc">

  <div class="card p-4">

    <h5 class="mb-3">Ajouter un document</h5>

    <!-- 🔍 CLIENT AUTOCOMPLETE -->
    <div class="mb-3">
      <label>Client</label>

      <input type="text"
            id="client-search"
            class="form-control"
            placeholder="Rechercher un client...">

      <input type="hidden" id="client-id">

      <div id="client-results" class="list-group mt-1"></div>
    </div>

    <!-- 📂 DOSSIERS -->
    <div class="mb-3">

      <label>Dossier</label>
      
      <select id="dossier-select" class="form-control">

      </select>
      
      <button class="btn btn-sm btn-outline-primary mt-2" onclick="openModal('add-dossier')">
        + Nouveau dossier
      </button>

    </div>

    <!-- 📄 UPLOAD -->
    <div class="mb-3">
      <label>Document</label>
      <input type="file" id="file-input" class="form-control">
    </div>

    <!-- 🤖 OCR RESULT -->
    <div class="mb-3">
      <label>Texte extrait (OCR)</label>
      <textarea id="ocr-text" class="form-control" rows="4"></textarea>
    </div>

    <!-- 🏷️ MOTS CLÉS -->
    <div class="mb-3">
      <label>Mots-clés</label>
      <input type="text" id="keywords" class="form-control">
    </div>

    <button type="submit" class="btn btn-primary" onclick="uploadDocument()">
      Enregistrer
    </button>

  </div>
</div>


<script>
  document.addEventListener("DOMContentLoaded", function () {

  const input = document.getElementById("client-search");
  const resultsBox = document.getElementById("client-results");
  const hiddenId = document.getElementById("client-id");

  input.addEventListener("input", function () {

    let query = this.value.trim();

    if (query.length < 2) {
      resultsBox.innerHTML = "";
      return;
    }

    fetch(`/accounts/clients/search/?q=${query}`)
      .then(res => res.json())
      .then(data => {

        resultsBox.innerHTML = "";

        data.forEach(client => {

          let item = document.createElement("button");
          item.className = "list-group-item list-group-item-action";

          item.innerText = `${client.nom} ${client.prenom} — ${client.numero_identite}`;

          item.onclick = function () {
            input.value = `${client.nom} ${client.prenom}`;
            hiddenId.value = client.id;
            resultsBox.innerHTML = "";

            loadDossiers(client.id);
          };

          resultsBox.appendChild(item);
        });

      });

  });

});

document.getElementById("client").addEventListener("change", function () {
    let clientId = this.value;

    fetch(`docs/dossiers/client/?client_id=${clientId}`)
        .then(response => response.json())
        .then(data => {
            let dossierSelect = document.getElementById("dossier");
            dossierSelect.innerHTML = "";

            if (data.length === 0) {
                dossierSelect.innerHTML = `<option>Aucun dossier</option>`;
            } else {
                data.forEach(d => {
                    dossierSelect.innerHTML += `
                        <option value="${d.id}">
                            ${d.reference_dossier} (${d.statut})
                        </option>
                    `;
                });
            }
        });
    
});

function selectClient(client) {
  document.getElementById("client-id").value = client.id;
  document.getElementById("client-search").value = client.nom;

  loadDossiers(client.id);
}

function loadDossiers(clientId) {

  let select = document.getElementById("dossier-select");

  select.innerHTML = `<option>Chargement...</option>`;

  fetch(`/docs/dossiers/client/${clientId}/`)
    .then(res => res.json())
    .then(data => {

      select.innerHTML = "";

      if (data.length === 0) {
        select.innerHTML = `<option>Aucun dossier</option>`;
        return;
      }

      data.forEach(d => {
        let option = document.createElement("option");
        option.value = d.id;
        option.textContent = d.reference_dossier;
        select.appendChild(option);
      });

    })
    .catch(err => {
      console.error(err);
      select.innerHTML = `<option>Erreur</option>`;
    });
}

function uploadDocument() {

  let file = document.getElementById("file-input").files[0];
  let dossier = document.getElementById("dossier-select").value;

  let formData = new FormData();
  formData.append("file", file);
  formData.append("dossier", dossier);

  fetch("/documents/upload/", {
    method: "POST",
    body: formData
  })
  .then(res => res.json())
  .then(data => {
    alert("Document enregistré !");
  });
}
</script>
