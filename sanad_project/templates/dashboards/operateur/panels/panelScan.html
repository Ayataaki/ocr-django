<!-- ENHANCED PANEL: Numérisation OCR -->
<div class="panel {% if active_panel == 'scan' %}active{% endif %}" id="panel-scan">
    <div class="two-columns">
        <!-- Left Column: Scan & Upload -->
        <div class="card">
            <div class="card-body">
                <!-- Modernized Header -->
                <div class="enhanced-section-header" style="margin-bottom: 24px;">
                    <div class="enhanced-section-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
                        </svg>
                    </div>
                    <div class="enhanced-section-text">
                        <span class="enhanced-section-title">Numérisation OCR</span>
                        <span class="enhanced-section-subtitle">Scannez ou importez un document</span>
                    </div>
                </div>

                <!-- Enhanced Upload Zone -->
                <div class="enhanced-upload-zone" id="scan-upload-zone" onclick="triggerFileUpload()">
                    <div class="upload-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                    </div>
                    <p>Cliquez pour importer un document</p>
                    <small>PDF, JPG, PNG — max 50 Mo</small>
                    <input type="file" id="scan-file-input" style="display: none;" accept=".pdf,.jpg,.jpeg,.png" onchange="handleFileUpload(this.files[0])">
                </div>

                <!-- File Preview Section -->
                <div id="scan-file-preview" style="display: none;" class="file-preview-card">
                    <div class="file-info">
                        <div class="file-details">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="24" height="24">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                <polyline points="14 2 14 8 20 8"/>
                            </svg>
                            <div>
                                <div class="file-name-text" id="scan-file-name"></div>
                                <div class="file-size-text" id="scan-file-size"></div>
                            </div>
                        </div>
                        <button class="remove-file-btn" onclick="removeScanFile()">Supprimer</button>
                    </div>
                </div>

                <!-- Scan Options -->
                <div class="scan-options">
                    <button class="btn btn-secondary" onclick="startDeviceScan()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                            <circle cx="12" cy="13" r="4"/>
                        </svg>
                        Scanner depuis appareil
                    </button>
                    <button class="btn btn-primary" id="ocr-launch-btn" onclick="launchOCR()" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                        </svg>
                        Lancer l'OCR
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Column: OCR Result -->
        <div class="card">
            <div class="card-body">
                <div class="form-section-title" style="margin-bottom: 16px;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M4 7V4h16v3"/>
                        <path d="M9 20h6"/>
                        <path d="M12 4v16"/>
                        <path d="M8 12h8"/>
                    </svg>
                    Résultat OCR
                </div>

                <!-- OCR Viewer -->
                <div id="ocr-viewer" class="ocr-viewer">
                    <div class="ocr-empty-state">
                        <!-- <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <path d="M12 18v-4"/>
                            <path d="M8 18v-4"/>
                            <path d="M16 18v-4"/>
                        </svg> -->
                        <p>Aucun document traité</p>
                        <small>Importez un document puis lancez l'OCR</small>
                    </div>
                </div>

                <!-- OCR Processing State -->
                <div id="ocr-processing" class="ocr-processing" style="display: none;">
                    <div class="processing-spinner"></div>
                    <p>Traitement OCR en cours...</p>
                    <small>Analyse du document et extraction du texte</small>
                </div>

                <!-- OCR Result Content -->
                <div id="ocr-result" class="ocr-result" style="display: none;">
                    <div class="ocr-result-header">
                        <div class="ocr-confidence">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <span>Confiance: <strong id="ocr-confidence">98%</strong></span>
                        </div>
                        <button class="btn-icon-only" onclick="copyOCRText()" title="Copier le texte">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                        </button>
                    </div>
                    <div class="ocr-text-content" id="ocr-text-content">
                        <!-- OCR extracted text will appear here -->
                    </div>
                    <div class="ocr-extracted-keywords">
                        <div class="keywords-label">Mots-clés extraits :</div>
                        <div class="keyword-tags-list" id="ocr-keywords-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

    function displayOCRResult(result) {

        const confidenceEl = document.querySelector('.ocr-confidence strong');

        } else if (result.confidence >= 80) {
            confidenceEl.style.color = 'var(--amber)';
        } else {
            confidenceEl.style.color = 'var(--red)';
        }
        
        // Format text with line breaks
        ocrTextContent.innerHTML = result.text.replace(/\n/g, '<br>');
        
        // Display keywords as clickable tags
        keywordsList.innerHTML = result.keywords.map(keyword =>
