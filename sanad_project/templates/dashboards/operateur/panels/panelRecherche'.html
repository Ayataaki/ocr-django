<div class="panel {% if active_panel == 'recherche' %}active{% endif %}" id="panel-recherche">

    <!-- <div class="panel" id="op-panel-recherche"> -->
      <div class="card" style="margin-bottom:16px">
        <div class="form-grid cols3" style="margin-bottom:12px">
          <div class="field"><label>Recherche libre</label>
            <input id="main-search" placeholder="Nom, acte, référence, TF..." onkeydown="if(event.key==='Enter')doSearch(this.value)"/>
          </div>
          <div class="field"><label>Type de document</label>
            <select><option>Tous les types</option><option>Acte notarié</option><option>Titre foncier</option><option>Contrat</option></select>
          </div>
          <div class="field"><label>Période</label>
            <select><option>Toute la période</option><option>Aujourd'hui</option><option>Cette semaine</option><option>Ce mois</option><option>Cette année</option></select>
          </div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn-primary" onclick="doSearch(document.getElementById('main-search').value)">Rechercher</button>
          <button class="btn-ghost">Réinitialiser</button>
        </div>
      </div>
      <div id="search-results" style="display:none">
        <div style="font-size:12px;color:var(--text3);margin-bottom:10px" id="results-count"></div>
        <div id="results-list"></div>
      </div>
      <div id="search-empty" style="text-align:center;padding:40px;color:var(--text3)">
        <svg viewBox="0 0 24 24" style="width:40px;height:40px;fill:var(--border2);margin-bottom:10px"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <p style="font-size:13px">Utilisez la recherche pour trouver des documents</p>
        <p style="font-size:11px;margin-top:4px">Recherche par nom, référence, type, mot-clé OCR...</p>
      </div>
    </div>
